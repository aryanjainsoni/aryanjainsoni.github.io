# Jab bhi main branch par push hota hai, ye site build karke GitHub Pages par daal deta hai.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Roz raat ~12 baje (IST) site dobara banti hai taaki LeetCode ka naya data aa jaye.
  # Isse koi commit nahi banta — sirf site refresh hoti hai.
  schedule:
    - cron: '35 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
